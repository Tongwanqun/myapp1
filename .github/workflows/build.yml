名称：构建安卓 APK

在:
  推:
    分支：[ 主 ]
  工作流触发:

工作:
  构建:
    运行于：ubuntu-latest

    步骤:
      - 名称: 结账代码
        使用： actions/checkout@v4

      - 名称上传 APK
        使用：actions/setup-node@v4
        与：
          节点版本：20

      - 名称: 设置Java
        使用： actions/setup-java@v4
        与：
          分布：'temurin'
          java-version：'17'

      - 名称: 安装依赖项
        运行：npm install

      - 名称: 构建安卓APK
        运行： |
          npx cap init 秒查 com.myapp.datasearch --web-dir=.
          npx cap add android
          npx cap copy
          npx cap sync
          cd 安卓
          chmod +x gradlew
          ./gradlew assembleDebug

      - 名称: 上传 APK



          路径：android/app/build/outputs/apk/debug/app-debug.apk
